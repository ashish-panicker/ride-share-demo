server.port=8082
spring.application.name=ride-service

spring.datasource.url=jdbc:h2:mem:ridedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

spring.cloud.openfeign.circuitbreaker.enabled=true
passenger.service.url=http://localhost:8081

resilience4j.circuitbreaker.instances.passengerService.registerHealthIndicator=true

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
